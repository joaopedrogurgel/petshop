<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Animal - Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">Petshop</a>
      <a class="nav-link text-white" href="../../index.html">Início</a>
      <a class="nav-link text-white" href="../cliente/cadastro.html">Clientes</a>
      <a class="nav-link text-white" href="../funcionario/cadastro.html">Funcionários</a>
      <a class="nav-link text-white" href="../animal/cadastro.html">Animais</a>
      <a class="nav-link text-white" href="/api/index.php?pagina=atendimento_cadastro">Atendimentos</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Cadastrar Animal</h1>

    <p>
      <a href="cadastro.html">Cadastro</a>
      <a href="consulta.html">Consulta</a>
      <a href="alteracao.html">Alteração</a>
      <a href="remocao.html">Remoção</a>
      <a href="/api/index.php?pagina=animal_relatorio">Relatório</a>
    </p>

    <form action="/api/index.php" method="post" onsubmit="return validarAnimal()">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex.: Thor" required>
      </div>
      <div class="mb-3">
        <label for="peso" class="form-label">Peso (kg)</label>
        <input type="number" class="form-control" id="peso" name="peso" step="0.01" min="0.01" placeholder="Ex.: 12.5" required>
      </div>
      <div class="mb-3">
        <label for="altura" class="form-label">Altura (cm)</label>
        <input type="number" class="form-control" id="altura" name="altura" step="0.01" min="0.01" placeholder="Ex.: 45" required>
      </div>
      <button type="submit" name="pagina" value="animal_cadastrar" class="btn btn-primary">Cadastrar</button>
      <a href="../../index.html" class="btn btn-secondary">Voltar</a>
    </form>
  </div>

  <footer class="text-center mt-5">
    <p>Programação de Sistemas Web - Software para Gerenciamento de Petshop</p>
  </footer>

  <script>
    function validarAnimal() {
      var peso = document.getElementById("peso").value;
      var altura = document.getElementById("altura").value;

      if (peso <= 0 || altura <= 0) {
        alert("O peso e a altura devem ser maiores que zero!");
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
